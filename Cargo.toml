[package]
name = "corvid"
version = "0.4.2"
edition = "2021"
rust-version = "1.74"
description = "Embeddable broker and codec engine for the Corvid wire protocol (CVWP)"
license = "Apache-2.0"
readme = "README.md"
repository = "https://example.invalid/corvid"
keywords = ["protocol", "streaming", "codec", "broker", "telemetry"]
categories = ["network-programming", "encoding"]

[lib]
name = "corvid"
path = "src/lib.rs"

[[bin]]
name = "corvidctl"
path = "src/bin/corvidctl.rs"

[features]
default = ["cli"]
cli = []
# Extra runtime assertions used by the test harness; off in release.
audit = []

[profile.release]
opt-level = 3
debug = true
panic = "unwind"
overflow-checks = false

[profile.dev]
overflow-checks = false
